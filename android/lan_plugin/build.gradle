plugins {
    id 'com.android.library' version '8.6.1'
    id 'org.jetbrains.kotlin.android' version '2.1.21'
}

android {
    namespace 'pl.zarajczyk.jumpingpenguin.lan'
    compileSdk 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        minSdk 28
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Compile against the exact export template used by this project. The app
    // already packages Godot; the plugin must not embed another engine copy.
    compileOnly files('../build/libs/release/godot-lib.template_release.aar')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
}
